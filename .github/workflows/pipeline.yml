name: Tourism Project Pipeline

on:
  push:
    branches:
      - main               # Automatically triggers on every push to main
  workflow_dispatch:        # Also lets you click "Run workflow" in the Actions tab

# The final job commits the trained model back to the repo, so the
# workflow needs write access to repository contents.
permissions:
  contents: write

jobs:

  # ---------------------------------------------------------------------
  # Job 1: Validate the raw dataset that lives in tourism_project/data/
  # ---------------------------------------------------------------------
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Register dataset
        run: python tourism_project/model_building/data_register.py
      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  # ---------------------------------------------------------------------
  # Job 2: Clean the data and create train/test splits
  # ---------------------------------------------------------------------
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Run data preparation
        run: python tourism_project/model_building/prep.py
      - name: Upload train/test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  # ---------------------------------------------------------------------
  # Job 3: Tune, train, evaluate, track with MLflow, and commit the model
  # ---------------------------------------------------------------------
  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Download train/test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Train, tune, and evaluate the model
        run: python tourism_project/model_building/train.py
      - name: Upload MLflow experiment logs
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: mlruns
      - name: Commit trained model back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_model.joblib
          git commit -m "Update trained model [skip ci]" || echo "No changes to commit"
          git push
